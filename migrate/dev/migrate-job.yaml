# Migration DB cho experts-be (dev).
#
# Chạy như PreSync hook của Application experts-be-api-dev: ArgoCD khởi động Job
# này TRƯỚC khi cập nhật Deployment. Job hỏng → sync dừng → pod cũ vẫn chạy với
# schema cũ. Code và schema vì thế luôn nhất quán.
#
# Backup đẩy lên S3 (AWS Singapore) chứ không phải NFS trong cluster — để khi cả
# cụm FKE hoặc VM database gặp sự cố thì bản dump vẫn còn.
# Dump hoặc upload hỏng → KHÔNG migrate: không có điểm khôi phục thì không đổi schema.
#
# Tag image do CI thay bằng sed, mốc là chuỗi "experts-be-migrate:".
apiVersion: batch/v1
kind: Job
metadata:
  name: experts-be-migrate
  namespace: experts-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/component: be-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: fke-registry
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: dump
          image: mysql:8.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Dump $DB_DATABASE @ $DB_HOST"
              mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
                --single-transaction --quick --no-tablespaces --set-gtid-purged=OFF \
                --routines --triggers "$DB_DATABASE" | gzip > /work/dump.sql.gz
              ls -lh /work/dump.sql.gz
              test -s /work/dump.sql.gz
          envFrom:
            - secretRef:
                name: experts-be-env
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            limits: { cpu: 500m, memory: 512Mi }
            requests: { cpu: 50m, memory: 128Mi }
        - name: upload
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              KEY="db-backups/dev/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz"
              echo "Upload -> s3://$S3_BUCKET_PRIVATE/$KEY"
              aws s3 cp /work/dump.sql.gz "s3://$S3_BUCKET_PRIVATE/$KEY"
              aws s3 ls "s3://$S3_BUCKET_PRIVATE/db-backups/dev/" | tail -5
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: experts-be-env, key: S3_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: experts-be-env, key: S3_SECRET_ACCESS_KEY } }
            - name: AWS_DEFAULT_REGION
              valueFrom: { secretKeyRef: { name: experts-be-env, key: S3_REGION } }
            - name: S3_BUCKET_PRIVATE
              valueFrom: { secretKeyRef: { name: experts-be-env, key: S3_BUCKET_PRIVATE } }
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            limits: { cpu: 500m, memory: 256Mi }
            requests: { cpu: 50m, memory: 64Mi }
      containers:
        - name: migrate
          image: registry-hn02.fke.fptcloud.com/344af395-857e-4e68-83ea-3972784eb4cb/experts-be-migrate:dev-8-9652890
          envFrom:
            - secretRef:
                name: experts-be-env
          resources:
            limits: { cpu: 1000m, memory: 1024Mi }
            requests: { cpu: 100m, memory: 256Mi }
